# Publica la oficina en GitHub Pages en cada cambio a main. Como sitio estático no hay servidor: la página carga
# oficina.config.json y corre ella misma el modo demo. Si el repo trae su propio oficina.config.json, se usa ese; si no,
# el de ejemplo.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: La configuración del sitio
        run: |
          if [ -f oficina.config.json ]; then cp oficina.config.json public/oficina.config.json
          else cp oficina.config.ejemplo.json public/oficina.config.json; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: despliegue
        uses: actions/deploy-pages@v4
